# Claude Code (GUIから直接起動される場合) via AWS Bedrock
# systemd user manager が読み、niri.service 経由で GUI アプリ全体に伝播する。
# シークレット (AWS_BEARER_TOKEN_BEDROCK) は Git 管理外の
# ~/.config/environment.d/60-bedrock-secret.conf に置く。
#
# Claude Desktop 本体 (Chat/Cowork) の推論は claude.ai OAuth なので、ここでは変わらない。
#
# モデル指定 (ANTHROPIC_MODEL / ANTHROPIC_DEFAULT_*_MODEL) はここに置かない。
# ターミナル用は shell/.zshenv にあり、Desktop 内の Code セッションはアプリの
# モデル選択が優先される。
# ここに残すと Bedrock 固有のプロファイルIDが GUI セッション全体に効くだけで無意味。
CLAUDE_CODE_USE_BEDROCK=1
AWS_REGION=ap-northeast-1
